<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a chair | {{name}}</title>
  <meta name="description" content="Choose a service, a barber and a time, and book your chair at {{name}} online.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#231a33">
  <script src="/js/theme.js"></script>
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
<!--#header-->
<main id="main">
  <div class="wrap">
    <div class="page-head"><h1>Book a chair</h1></div>
    <noscript><p class="form-error">Online booking needs JavaScript. Please call {{phone}} to book.</p></noscript>
    <ol class="steps" id="steps" aria-label="Booking steps"></ol>
    <div class="flow-grid" id="flow" data-step="service">
      <div id="panel"></div>
      <aside class="plate summary" id="summary" aria-label="Your booking so far"></aside>
    </div>
  </div>
</main>
<!--#footer-->
<script type="module" src="/js/book.js"></script>
</body>
</html>
