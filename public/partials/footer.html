<footer class="site-footer">
  <div class="wrap foot">
    <div>
      <p class="wordmark">{{name}}</p>
      {{footerAddress}}
      <p><a href="tel:{{phoneHref}}">{{phone}}</a></p>
      {{footerEmail}}
    </div>
    <div>
      <h2 class="foot-h">Hours</h2>
      {{hours}}
    </div>
    <div>
      <h2 class="foot-h">Quick links</h2>
      <ul class="foot-links">
        <li><a href="/book.html">Book a chair</a></li>
        <li><a href="/account.html">My bookings</a></li>
        <li><a href="/#services">Services and prices</a></li>
        <li><a href="/#barbers">Meet the barbers</a></li>
        <li data-install hidden><a href="#">Install the app</a></li>
      </ul>
    </div>
  </div>
  <div class="wrap">
    <p class="legal">&copy; {{year}} {{name}}</p>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
