<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account | {{name}}</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#231a33">
  <script src="/js/theme.js"></script>
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
<!--#header-->
<main id="main">
  <div class="wrap auth-page">
    <div>
      <h1>Your chair is waiting.</h1>
      <p class="lead">Create an account to book online, see your upcoming cuts and cancel in one tap.</p>
    </div>
    <div class="plate auth-card">
      <form data-auth-form="register" novalidate>
        <p class="form-error" data-form-error role="alert"></p>
        <div class="field">
          <label for="name">Full name</label>
          <input class="input" id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-error">
          <p class="field-error" id="name-error" data-error-for="name"></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
          <p class="field-error" id="email-error" data-error-for="email"></p>
        </div>
        <div class="field">
          <label for="phone">Phone (optional)</label>
          <input class="input" id="phone" name="phone" type="tel" autocomplete="tel" aria-describedby="phone-hint phone-error">
          <p class="hint" id="phone-hint">So the shop can reach you if something changes.</p>
          <p class="field-error" id="phone-error" data-error-for="phone"></p>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="password-hint password-error">
          <p class="hint" id="password-hint">At least 8 characters.</p>
          <p class="field-error" id="password-error" data-error-for="password"></p>
        </div>
        <label class="check"><input type="checkbox" id="show-pw"> Show password</label>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>
      <p class="auth-switch">Already have an account? <a data-switch href="/login.html">Log in</a></p>
    </div>
  </div>
</main>
<!--#footer-->
<script type="module" src="/js/auth.js"></script>
</body>
</html>
